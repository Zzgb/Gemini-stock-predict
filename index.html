<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股价预测系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen">

    <!-- 动态星空背景 -->
    <canvas id="starCanvas" class="fixed top-0 left-0 w-full h-full pointer-events-none" style="z-index: 0;"></canvas>

    <nav class="max-w-6xl mx-auto px-6 py-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative z-10">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">AI 股价分析</h1>
            <p class="text-xs text-gray-500 mt-1">数据存储与趋势预测</p>
        </div>
        <div class="flex gap-2 w-full md:w-auto">
            <input type="text" id="stock-input" placeholder="输入代码 (如 1810.HK)" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-sm outline-none focus:border-white/30 flex-1 md:w-48 transition-all">
            <button id="add-btn" class="bg-white text-black font-bold px-6 py-2 rounded-xl text-sm hover:bg-gray-200 transition">分析</button>
        </div>
    </nav>

    <div id="stock-container" class="max-w-6xl mx-auto px-6 space-y-3 pb-20 relative z-10"></div>

    <script type="module" src="./script.js"></script>

    <!-- 流星星空（最终稳定版） -->
    <script>
        (function() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            const STAR_COUNT = 200;
            let stars = [];
            let meteors = [];
            const MAX_METEORS = 10;

            const COLORS = {
                UP: { r: 255, g: 69, b: 58 },   // 红
                DOWN: { r: 50, g: 215, b: 75 }  // 绿
            };

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            class Star {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.radius = Math.random() * 2 + 0.3;
                    this.baseAlpha = Math.random() * 0.6 + 0.2;
                    this.twinkleSpeed = Math.random() * 0.015 + 0.005;
                    this.twinkleOffset = Math.random() * Math.PI * 2;
                }
                getAlpha(time) {
                    return Math.max(0, this.baseAlpha + Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.15);
                }
                draw(ctx, time) {
                    const alpha = this.getAlpha(time);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                }
            }

            class Meteor {
                constructor() {
                    this.goingUp = Math.random() > 0.5;
                    this.baseColor = this.goingUp ? COLORS.UP : COLORS.DOWN;
                    this.color = this.baseColor;

                    const fromLeft = Math.random() > 0.5;
                    const innerMargin = height * 0.25;   // 保证出生点不贴边

                    if (this.goingUp) {
                        // 上涨：从下方内部区域生成
                        this.y = height - innerMargin + Math.random() * (innerMargin * 0.6);
                        if (fromLeft) {
                            this.x = 10;
                            this.baseAngle = -Math.PI * 0.5 + Math.random() * 0.3; // -90°~-36° 向右上
                        } else {
                            this.x = width - 10;
                            this.baseAngle = -Math.PI * 0.8 + Math.random() * 0.3; // -144°~-90° 向左上
                        }
                    } else {
                        // 下跌：从上方内部区域生成
                        this.y = innerMargin - Math.random() * (innerMargin * 0.6);
                        if (fromLeft) {
                            this.x = 10;
                            this.baseAngle = Math.PI * 0.3 + Math.random() * 0.3; // 54°~108° 向右下
                        } else {
                            this.x = width - 10;
                            this.baseAngle = Math.PI * 0.6 + Math.random() * 0.3; // 108°~162° 向左下
                        }
                    }

                    this.angle = this.baseAngle;
                    this.speed = Math.random() * 6 + 6;   // 6~12，更快
                    this.trailLength = 30;
                    this.trailPoints = [];
                }

                update() {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;

                    this.trailPoints.push({ x: this.x, y: this.y, color: this.color });
                    if (this.trailPoints.length > this.trailLength) {
                        this.trailPoints.shift();
                    }

                    // 用拖尾末端（最早的点）判断离开屏幕
                    if (this.trailPoints.length === 0) return true;
                    const tail = this.trailPoints[0];
                    const margin = 80;
                    return !(tail.x < -margin || tail.x > width + margin ||
                             tail.y < -margin || tail.y > height + margin);
                }

                draw(ctx) {
                    const points = this.trailPoints;
                    if (points.length === 0) return;
                    if (points.length === 1) {
                        const p = points[0];
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, 1)`;
                        ctx.fill();
                        return;
                    }
                    // 分段绘制，上升红，下降绿
                    for (let i = 1; i < points.length; i++) {
                        const prev = points[i - 1];
                        const curr = points[i];
                        const isUp = prev.y > curr.y;
                        const segColor = isUp ? COLORS.UP : COLORS.DOWN;
                        ctx.beginPath();
                        ctx.moveTo(prev.x, prev.y);
                        ctx.lineTo(curr.x, curr.y);
                        const alpha = 0.3 + (i / points.length) * 0.7;
                        ctx.strokeStyle = `rgba(${segColor.r}, ${segColor.g}, ${segColor.b}, ${alpha})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    // 头部亮点
                    const head = points[points.length - 1];
                    ctx.beginPath();
                    ctx.arc(head.x, head.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${head.color.r}, ${head.color.g}, ${head.color.b}, 1)`;
                    ctx.fill();
                }
            }

            function createStars() {
                stars = Array.from({ length: STAR_COUNT }, () => new Star());
            }

            function spawnMeteor() {
                if (meteors.length < MAX_METEORS) {
                    meteors.push(new Meteor());
                }
            }

            let lastTime = 0, meteorTimer = 0;

            function animate(timestamp) {
                const time = timestamp || 0;
                const delta = timestamp - lastTime || 16;
                lastTime = timestamp;

                ctx.clearRect(0, 0, width, height);
                stars.forEach(s => s.draw(ctx, time));

                meteors = meteors.filter(m => {
                    const alive = m.update();
                    if (alive) m.draw(ctx);
                    return alive;
                });

                meteorTimer += delta;
                const spawnInterval = Math.random() * 2500 + 500; // 1.5~4秒生成一颗
                if (meteorTimer > spawnInterval) {
                    spawnMeteor();
                    meteorTimer = 0;
                }

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => { resize(); createStars(); });
            resize();
            createStars();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
